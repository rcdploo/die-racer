<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIE-RACER ARENA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Boogaloo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addon-fit.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    :root {
      --amber: #ffb000;
      --amber-dim: #7a5500;
      --amber-glow: #ffcc44;
      --bg: #0a0800;
      --bg2: #110e00;
      --border: #3a2e00;
      --red: #ff4422;
      --green: #44ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--amber);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Screen flicker */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.85; }
      94% { opacity: 1; }
      96% { opacity: 0.9; }
      97% { opacity: 1; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 99;
      animation: flicker 8s infinite;
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 18px 24px 10px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Boogaloo', cursive;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--amber-glow);
      text-shadow: 0 0 12px var(--amber), 0 0 30px var(--amber-dim);
      white-space: nowrap;
    }

    .logo span {
      color: var(--red);
      text-shadow: 0 0 12px var(--red);
    }

    .tagline {
      font-size: 0.7rem;
      color: var(--amber-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .status-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.dead {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
      animation: none;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #status-text { color: var(--amber-dim); }

    .terminal-wrapper {
      width: 100%;
      max-width: 900px;
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
    }

    #terminal {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg2);
      padding: 8px;
      box-shadow: 0 0 20px rgba(255,176,0,0.08), inset 0 0 30px rgba(0,0,0,0.4);
      min-height: 520px;
    }

    /* Override xterm colors for amber CRT look */
    .xterm { font-family: 'Share Tech Mono', monospace !important; }
    .xterm-viewport { background: var(--bg2) !important; }

    footer {
      width: 100%;
      max-width: 900px;
      padding: 8px 24px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--amber-dim);
      letter-spacing: 0.1em;
    }

    .btn-restart {
      background: none;
      border: 1px solid var(--amber-dim);
      color: var(--amber-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      padding: 4px 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-restart:hover {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 8px var(--amber-dim);
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      flex-direction: column;
      gap: 20px;
    }

    #overlay.hidden { display: none; }

    .overlay-title {
      font-family: 'Boogaloo', cursive;
      font-size: 3.5rem;
      color: var(--amber-glow);
      text-shadow: 0 0 20px var(--amber), 0 0 60px var(--amber-dim);
      text-align: center;
      line-height: 1.1;
    }

    .overlay-title span { color: var(--red); text-shadow: 0 0 20px var(--red); }

    .overlay-sub {
      font-size: 0.8rem;
      color: var(--amber-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .btn-start {
      background: none;
      border: 2px solid var(--amber);
      color: var(--amber);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.25em;
      padding: 12px 36px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 12px;
      box-shadow: 0 0 16px var(--amber-dim);
      animation: blink 1.2s step-end infinite;
      transition: all 0.15s;
    }

    .btn-start:hover {
      background: var(--amber);
      color: var(--bg);
      animation: none;
      box-shadow: 0 0 30px var(--amber);
    }

    .ascii-art {
      font-size: 0.65rem;
      color: var(--amber-dim);
      text-align: center;
      line-height: 1.3;
      white-space: pre;
    }
  </style>
</head>
<body>

  <!-- Start screen overlay -->
  <div id="overlay">
    <div class="ascii-art">~\_DR_>  @@[DR]>  =}(DR)>  8>{DR}></div>
    <div class="overlay-title">DIE-RACER<br><span>ARENA</span></div>
    <div class="overlay-sub">place your bets &bull; roll the dice &bull; glory awaits</div>
    <button class="btn-start" id="btn-start">INSERT COIN</button>
  </div>

  <header>
    <div class="logo">DIE-RACER <span>ARENA</span></div>
    <div class="tagline">die-based horsepower</div>
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">CONNECTED</span>
    </div>
  </header>

  <div class="terminal-wrapper">
    <div id="terminal"></div>
  </div>

  <footer>
    <span>ENTER: submit &nbsp;|&nbsp; TYPE 1 or 2 to pick &nbsp;|&nbsp; Y/N to respond</span>
    <button class="btn-restart" id="btn-restart">↺ NEW GAME</button>
  </footer>

  <script>
    const socket = io();
    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Set up xterm
    const term = new Terminal({
      theme: {
        background: '#110e00',
        foreground: '#ffb000',
        cursor: '#ffcc44',
        cursorAccent: '#0a0800',
        selectionBackground: '#3a2e00',
        black: '#0a0800',
        brightBlack: '#3a2e00',
        red: '#ff4422',
        brightRed: '#ff6644',
        green: '#44ff88',
        brightGreen: '#66ffaa',
        yellow: '#ffcc44',
        brightYellow: '#ffdd88',
        blue: '#4488ff',
        brightBlue: '#66aaff',
        magenta: '#ff88cc',
        brightMagenta: '#ffaadd',
        cyan: '#44ddff',
        brightCyan: '#88eeff',
        white: '#ffb000',
        brightWhite: '#ffdd88',
      },
      fontFamily: '"Share Tech Mono", monospace',
      fontSize: 14,
      lineHeight: 1.4,
      cursorBlink: true,
      cursorStyle: 'block',
      scrollback: 500,
      convertEol: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    window.addEventListener('resize', () => fitAddon.fit());

    // Receive output from game
    socket.on('output', (data) => {
      term.write(data.data);
    });

    socket.on('game_over', () => {
      statusDot.classList.add('dead');
      statusText.textContent = 'GAME OVER';
      term.write('\r\n\r\n[ Press NEW GAME to play again ]\r\n');
    });

    socket.on('connect', () => {
      statusDot.classList.remove('dead');
      statusText.textContent = 'CONNECTED';
    });

    socket.on('connect_error', (err) => {
      statusDot.classList.add('dead');
      statusText.textContent = 'ERR: ' + err.message;
    });

    socket.on('disconnect', (reason) => {
      statusDot.classList.add('dead');
      statusText.textContent = 'DISCONNECTED: ' + reason;
    });

    // Send keystrokes to game
    term.onKey(({ key }) => {
      socket.emit('input', { key });
    });

    // Start button
    btnStart.addEventListener('click', () => {
      overlay.classList.add('hidden');
      term.focus();
    });

    // Restart button reloads the page (server handles new game on reconnect)
    btnRestart.addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
